name: Swift

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      # Kokoro's engine is behind the package trait "Kokoro", which fetches ONNX Runtime (iOS and macOS only). Without a
      # model (SPEECHWARP_KOKORO_DIR) the tests that run it are skipped; this checks that it builds and the rest pass.
      - name: Test Kokoro
        if: runner.os == 'macOS'
        run: swift test --traits Kokoro --filter SpeechwarpVoiceKokoroTests

  ios:
    name: build for iOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: xcodebuild build -scheme Speechwarp -destination "generic/platform=iOS" -quiet
