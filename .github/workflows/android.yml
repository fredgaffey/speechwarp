name: Android

# Runs the Kotlin tests on the JVM and builds the AARs, which are left as artifacts, then runs speechwarp-voice's
# instrumented tests (Android's text-to-speech, the AAC cache) on an emulator. Nothing is published. The voice
# engines (speechwarp-voice-kokoro, and speechwarp-voice-espeak, GPL-3.0-or-later) are built and unit-tested too;
# their instrumented tests are only compiled, because those worth running need a Kokoro model.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Test
        run: ./gradlew :speechwarp:testReleaseUnitTest :speechwarp-voice:testReleaseUnitTest
      - name: Build the AAR
        run: ./gradlew :speechwarp:assembleRelease :speechwarp-voice:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: aar
          path: bindings/android/speechwarp/build/outputs/aar/*.aar
      - uses: actions/upload-artifact@v7
        with:
          name: aar-voice
          path: bindings/android/speechwarp-voice/build/outputs/aar/*.aar
      - name: Fetch eSpeak NG
        # For speechwarp-voice-espeak (GPL-3.0-or-later); not fetched by default.
        working-directory: .
        run: git submodule update --init --checkout --depth 1 third_party/espeak-ng
      - name: Test the voice engines
        # Kokoro's tests here use a stand-in for the model; eSpeak's run against a build for this runner, with the
        # data compiled here. The tests with a real Kokoro model are instrumented ones, run by hand on a device.
        run: ./gradlew :speechwarp-voice-kokoro:testReleaseUnitTest :speechwarp-voice-espeak:testReleaseUnitTest
      - name: Build the voice engines' AARs, and their instrumented tests
        run: >-
          ./gradlew :speechwarp-voice-kokoro:assembleRelease :speechwarp-voice-espeak:assembleRelease
          :speechwarp-voice-kokoro:assembleDebugAndroidTest :speechwarp-voice-espeak:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: aar-voice-engines
          path: |
            bindings/android/speechwarp-voice-kokoro/build/outputs/aar/*.aar
            bindings/android/speechwarp-voice-espeak/build/outputs/aar/*.aar

  # speechwarp-voice on a device: the system's text-to-speech (skipped if the image has no engine), the AAC round trip
  # through MediaCodec, and the reader with the native library.
  voice-emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the tests
        run: ./gradlew :speechwarp-voice:assembleDebugAndroidTest
      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: bindings/android
          script: ./gradlew :speechwarp-voice:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-emulator-results
          path: bindings/android/speechwarp-voice/build/reports/androidTests
