name: Rust, Go, Java, Flutter, React Native

# Tests for the bindings that need no packaging step. Nothing is published.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - run: cargo test
      - run: cargo package --list

  go:
    name: go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./bindings/go ./examples/go
      - run: go test ./bindings/go

  java-natives:
    name: java ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: bindings/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Test
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: java-natives-${{ matrix.os }}
          path: bindings/java/build/native-resources/natives

  java-jar:
    name: java jar for every system
    needs: java-natives
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bindings/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v8
        with:
          pattern: java-natives-*
          merge-multiple: true
          path: bindings/java/extra-natives/natives
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: java-jar
          path: bindings/java/build/libs/*.jar

  flutter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Emscripten, for the WebAssembly build. Installed directly: the setup-emsdk action still runs on
      # Node.js 20, which GitHub is retiring.
      - name: Install Emscripten
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Build the library for this computer
        run: cmake -B build -DSPEECHWARP_BUILD_TESTS=OFF && cmake --build build
      - name: Dart tests
        working-directory: bindings/flutter
        run: |
          flutter pub get
          flutter analyze   # with lib/src/wasm_bytes.dart as the empty placeholder git holds
          SPEECHWARP_LIBRARY=$GITHUB_WORKSPACE/build/libspeechwarp.dylib flutter test
      # Writes lib/src/wasm_bytes.dart, the library as WebAssembly, for the web.
      - name: Dart tests in Chrome, against the WebAssembly
        working-directory: bindings/flutter
        run: |
          sh scripts/build_web.sh
          flutter analyze
          flutter test --platform chrome
      - name: In the real app on macOS
        working-directory: bindings/flutter/example
        run: flutter test integration_test -d macos

  # The Flutter voice plugins (bindings/flutter_voice): the Dart tests, then the example's integration test in the real
  # app, which reads aloud with the system's voices and eSpeak NG and plays through the platform. Nothing is published.
  flutter-voice-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch eSpeak NG
        run: git submodule update --init --checkout --depth 1 third_party/espeak-ng
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The example takes speechwarp's Android libraries from mavenLocal, so that it tests this commit's Kotlin.
      - name: Publish the Android libraries to mavenLocal
        working-directory: bindings/android
        run: ./gradlew publishToMavenLocal
      - name: Analyse and test the Dart side
        run: |
          for p in speechwarp_voice speechwarp_voice_kokoro speechwarp_voice_espeak; do
            (cd bindings/flutter_voice/$p && flutter pub get && flutter analyze) || exit 1
          done
          cd bindings/flutter_voice/speechwarp_voice && flutter test
      - name: Build the example
        working-directory: bindings/flutter_voice/speechwarp_voice/example
        run: flutter build apk --debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The system-voice tests skip themselves if the image has no text-to-speech engine; eSpeak's always run.
      - name: The integration test on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-snapshot
          working-directory: bindings/flutter_voice/speechwarp_voice/example
          script: flutter test integration_test -d emulator-5554

  flutter-voice-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # So that the example has eSpeak NG on iOS too (the Swift package's SpeechwarpVoiceEspeak exists only once built).
      - name: Fetch and build eSpeak NG for Swift
        run: |
          git submodule update --init --checkout --depth 1 third_party/espeak-ng
          bindings/dotnet/Speechwarp.Voice.Espeak/native-build/build-espeak.sh swift
      - name: Build the example for the simulator
        working-directory: bindings/flutter_voice/speechwarp_voice/example
        run: flutter build ios --simulator --debug
      - name: The integration test on a simulator
        working-directory: bindings/flutter_voice/speechwarp_voice/example
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print([r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]][-1])')
          device=$(xcrun simctl create speechwarp-flutter com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime" 2>/dev/null ||
                   xcrun simctl create speechwarp-flutter "$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print([d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if "iPhone" in d["name"]][-1])')" "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          flutter test integration_test -d "$device"

  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/react-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn prepare
      - run: yarn typecheck
      - run: yarn test
