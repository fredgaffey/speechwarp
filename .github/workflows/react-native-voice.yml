name: React Native voice

# The React Native voice packages in bindings/react-native-voice: react-native-speechwarp-voice, and the engine packages
# react-native-speechwarp-voice-espeak (GPL-3.0-or-later) and -kokoro. Type-checks and tests the JavaScript, then builds
# the example app, with all three, for Android and for the iOS simulator. The app is built, not run. Nothing is
# published (release-react-native.yml publishes the packages).
#
# The example builds against this repository's native libraries: on Android those of bindings/android, published to
# Maven Local first; on iOS the Swift sources and eSpeak NG's framework, built here and copied in by each package's
# scripts/vendor.sh.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/react-native-voice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch eSpeak NG
        run: git submodule update --init --checkout --depth 1 third_party/espeak-ng
      - name: Publish the Android libraries to Maven Local
        working-directory: bindings/android
        run: ./gradlew publishToMavenLocal
      - run: corepack enable
      - name: Install
        working-directory: bindings/react-native-voice
        run: yarn install --immutable
      - name: Build the example
        working-directory: bindings/react-native-voice/example/android
        run: ./gradlew assembleDebug --console=plain -PreactNativeArchitectures=arm64-v8a

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch eSpeak NG
        run: git submodule update --init --checkout --depth 1 third_party/espeak-ng
      - name: Build eSpeak NG for iOS
        run: bindings/dotnet/Speechwarp.Voice.Espeak/native-build/build-espeak.sh swift
      - run: corepack enable
      - name: Install, and copy in the native sources
        working-directory: bindings/react-native-voice
        run: |
          yarn install --immutable
          yarn prepare
          yarn workspace react-native-speechwarp-voice-espeak prepare
          yarn workspace react-native-speechwarp-voice-kokoro prepare
      - name: Install the pods, with Kokoro's engine
        working-directory: bindings/react-native-voice/example/ios
        run: SPEECHWARP_KOKORO=1 pod install
      - name: Build the example for the simulator
        working-directory: bindings/react-native-voice/example/ios
        run: >-
          xcodebuild -workspace SpeechwarpVoiceExample.xcworkspace -scheme SpeechwarpVoiceExample
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
