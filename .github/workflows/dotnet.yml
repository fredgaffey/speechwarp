name: .NET

# Builds the native library for every platform the NuGet package carries, tests the binding on the three
# desktop systems, and leaves the finished package as an artifact.
#
# Pushing a version tag (git tag v0.3.0 && git push origin v0.3.0) also publishes that package to nuget.org,
# once everything has passed. nuget.org trusts this workflow directly ("trusted publishing"): the job trades a
# GitHub token for a short-lived API key, so no key is stored here. The trust is set up on nuget.org for this
# repository, this file and the environment `nuget`; the repository variable NUGET_USER names the nuget.org
# account.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: native ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: android-arm64, os: ubuntu-latest }
          - { rid: android-x64, os: ubuntu-latest }
          - { rid: android-arm, os: ubuntu-latest }
          - { rid: win-x64, os: windows-latest, platform: x64 }
          - { rid: win-arm64, os: windows-latest, platform: ARM64 }
    steps:
      - uses: actions/checkout@v7
      - name: Build
        if: runner.os != 'Windows'
        # ANDROID_NDK_LATEST_HOME is set on GitHub's Linux runners.
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bindings/dotnet/build-native.sh ${{ matrix.rid }}
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -B build -A ${{ matrix.platform }} -DSPEECHWARP_BUILD_STATIC=OFF -DSPEECHWARP_BUILD_TESTS=OFF -DSPEECHWARP_BUILD_TOOLS=OFF
          cmake --build build --config Release
          mkdir -p bindings/dotnet/Speechwarp/runtimes/${{ matrix.rid }}/native
          # Renamed: speechwarp.dll would be the same file as the managed Speechwarp.dll (see Native.cs).
          cp build/Release/speechwarp.dll bindings/dotnet/Speechwarp/runtimes/${{ matrix.rid }}/native/libspeechwarp.dll
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: bindings/dotnet/Speechwarp/runtimes
          if-no-files-found: error

  ios:
    name: native ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: bindings/dotnet/build-ios.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ios-framework
          path: bindings/dotnet/Speechwarp/native
          if-no-files-found: error

  test:
    name: test ${{ matrix.os }}
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: bindings/dotnet/Speechwarp/runtimes
      - name: Test
        working-directory: bindings/dotnet
        run: dotnet test --project Speechwarp.Tests

  pack:
    needs: [test, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: bindings/dotnet/Speechwarp/runtimes
      - uses: actions/download-artifact@v8
        with:
          name: ios-framework
          path: bindings/dotnet/Speechwarp/native
      - name: Pack
        run: dotnet pack bindings/dotnet/Speechwarp -c Release -o package
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: package/*.nupkg

  voice:
    # Speechwarp.Voice (Apple's voices and the live reader) and the engines that plug into it: Speechwarp.Voice.Kokoro,
    # Speechwarp.Voice.Kokoro.Gpu and Speechwarp.Voice.Espeak (GPL-3.0-or-later). All for iOS, so they build on macOS,
    # where the iOS workload is available.
    name: voice packages
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install the iOS workload
        run: dotnet workload install ios
      - name: Fetch eSpeak NG
        run: git submodule update --init --checkout --depth 1 third_party/espeak-ng
      - name: Build eSpeak NG for iOS
        run: bindings/dotnet/Speechwarp.Voice.Espeak/native-build/build-espeak.sh dotnet
      - name: Get Xcode's Metal toolchain
        # MLX's shaders need it; recent Xcodes download it separately.
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - name: Build Kokoro for the GPU
        run: bindings/swift/KokoroGPU/build-frameworks.sh
      - name: Pack
        run: |
          for id in Speechwarp.Voice Speechwarp.Voice.Kokoro Speechwarp.Voice.Kokoro.Gpu Speechwarp.Voice.Espeak; do
            dotnet pack "bindings/dotnet/$id" -c Release -o package
          done
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-voice-package
          path: package/Speechwarp.Voice*.nupkg
          if-no-files-found: error

  publish:
    # Only for version tags, and only once every native has built and the tests have passed everywhere.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pack, voice]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # lets nuget.org check that the upload comes from this workflow
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
      - uses: actions/download-artifact@v8
        with:
          name: nuget-voice-package
      - name: Check the tag matches the version being published
        run: |
          ls *.nupkg
          for id in Speechwarp Speechwarp.Voice Speechwarp.Voice.Kokoro Speechwarp.Voice.Kokoro.Gpu Speechwarp.Voice.Espeak; do
            test -f "$id.${GITHUB_REF_NAME#v}.nupkg" ||
              { echo "Tag $GITHUB_REF_NAME does not match the version of $id"; exit 1; }
          done
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: |
          for id in Speechwarp Speechwarp.Voice Speechwarp.Voice.Kokoro Speechwarp.Voice.Kokoro.Gpu Speechwarp.Voice.Espeak; do
            dotnet nuget push "$id.${GITHUB_REF_NAME#v}.nupkg" --skip-duplicate \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
          done
