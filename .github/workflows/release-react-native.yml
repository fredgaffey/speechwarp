name: Release React Native

# Vendors the C sources, builds the package, type-checks and tests it, and checks that the packed tarball holds
# everything the Android and iOS builds compile. The packed package is left as an artifact. Nothing is
# published from a pull request or from main.
#
# Pushing a version tag (git tag v0.3.0 && git push origin v0.3.0) also publishes that tested package to npm.
# npm trusts this workflow directly ("trusted publishing"), so no token is stored here; the trust is set up on
# npmjs.com for this repository, this file and the environment `npm`. It can only be set up once the package
# exists, so the first release uses an access token instead: put a granular token with publish rights in the
# environment secret NPM_TOKEN, and delete the secret once trusted publishing is set up. While the secret
# exists it is used. The tag also publishes the other packages (python.yml, js.yml and the other
# release-*.yml).
#
# The same tag publishes the voice packages of bindings/react-native-voice (build-voice, publish-voice): each of the
# three npm package names needs trusted publishing set up on npmjs.com the same way.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/react-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      # Copies the C sources into cpp/speechwarp/ and builds lib/.
      - run: yarn prepare
      - run: yarn typecheck
      - run: yarn test
      - run: npm pack --ignore-scripts
      - name: Check the package holds what the native builds need
        run: |
          tar tzf react-native-speechwarp-*.tgz > contents.txt
          for file in package/LICENSE package/NOTICE package/Speechwarp.podspec package/android/CMakeLists.txt \
              package/cpp/SpeechwarpImpl.cpp package/cpp/speechwarp/include/speechwarp.h \
              package/cpp/speechwarp/src/speechwarp.c package/cpp/speechwarp/src/third_party_sonic.c \
              package/cpp/speechwarp/third_party/kissfft/kiss_fft.c package/cpp/speechwarp/third_party/sonic/LICENSE \
              package/cpp/speechwarp/third_party/speedy/LICENSE package/cpp/speechwarp/third_party/kissfft/COPYING \
              package/lib/module/index.js package/lib/typescript/src/index.d.ts; do
            grep -qx "$file" contents.txt || { echo "Missing from the package: $file"; exit 1; }
          done
          ! grep -E 'node_modules|/example/|__tests__|/\.' contents.txt ||
            { echo "Files that do not belong in the package"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: bindings/react-native/react-native-speechwarp-*.tgz

  publish:
    # Only for version tags, and only once the package has built and passed its tests.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # lets npm check that the upload comes from this workflow
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or later
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - name: Check the tag matches the version being published
        run: |
          ls *.tgz
          test -f "react-native-speechwarp-${GITHUB_REF_NAME#v}.tgz" ||
            { echo "Tag $GITHUB_REF_NAME does not match the version in bindings/react-native/package.json"; exit 1; }
      # The tarball the build job tested, so nothing is rebuilt here. Provenance is added automatically.
      - run: npm publish "react-native-speechwarp-${GITHUB_REF_NAME#v}.tgz" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # empty once trusted publishing is set up

  # The voice packages in bindings/react-native-voice: react-native-speechwarp-voice, react-native-speechwarp-voice-espeak
  # (GPL-3.0-or-later) and react-native-speechwarp-voice-kokoro. On macOS, because the eSpeak package carries eSpeak NG
  # built for iOS. Their Android halves depend on the Maven artifacts of the same version (release-maven.yml).
  build-voice:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bindings/react-native-voice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch eSpeak NG
        working-directory: .
        run: git submodule update --init --checkout --depth 1 third_party/espeak-ng
      - name: Build eSpeak NG for iOS
        working-directory: .
        run: bindings/dotnet/Speechwarp.Voice.Espeak/native-build/build-espeak.sh swift
      - run: corepack enable
      - run: yarn install --immutable
      # Each copies in the native sources it compiles on iOS and builds lib/.
      - run: |
          yarn prepare
          yarn workspace react-native-speechwarp-voice-espeak prepare
          yarn workspace react-native-speechwarp-voice-kokoro prepare
      - run: yarn typecheck
      - run: yarn test
      - name: Pack
        run: |
          npm pack --ignore-scripts
          (cd espeak && npm pack --ignore-scripts --pack-destination ..)
          (cd kokoro && npm pack --ignore-scripts --pack-destination ..)
      - name: Check the packages hold what the native builds need
        run: |
          check() {
            tar tzf "$1" > contents.txt
            shift
            for file in "$@"; do
              grep -qx "package/$file" contents.txt || { echo "Missing from $tarball: $file"; exit 1; }
            done
            ! grep -E 'node_modules|/example/|__tests__|/\.' contents.txt || { echo "Files that do not belong in $1"; exit 1; }
          }
          tarball=$(ls react-native-speechwarp-voice-[0-9]*.tgz)
          check "$tarball" LICENSE NOTICE SpeechwarpVoice.podspec android/build.gradle ios/RNSpeechwarpVoice.mm \
            ios/vendor/VoicedText.swift ios/vendor/SpeechwarpStream.swift cpp/speechwarp/include/speechwarp.h \
            cpp/speechwarp/include/module.modulemap cpp/speechwarp/src/speechwarp.c \
            cpp/speechwarp/third_party/kissfft/kiss_fft.c cpp/speechwarp/third_party/sonic/LICENSE \
            lib/module/index.js lib/typescript/src/index.d.ts
          tarball=$(ls react-native-speechwarp-voice-espeak-*.tgz)
          check "$tarball" COPYING NOTICE SpeechwarpVoiceEspeak.podspec android/build.gradle ios/EspeakPlugin.swift \
            ios/vendor/Espeak.swift ios/vendor/espeak-ng-data/en_dict ios/vendor/espeak-ng-data/phondata \
            ios/vendor/Frameworks/espeak_ng.xcframework/Info.plist \
            ios/vendor/Frameworks/espeak_ng.xcframework/ios-arm64/libespeak-ng.a \
            lib/module/index.js lib/typescript/src/index.d.ts
          tarball=$(ls react-native-speechwarp-voice-kokoro-*.tgz)
          check "$tarball" LICENSE NOTICE SpeechwarpVoiceKokoro.podspec android/build.gradle ios/KokoroPlugin.swift \
            ios/vendor/KokoroModels.swift ios/vendor/KokoroEngine.swift lib/module/index.js lib/typescript/src/index.d.ts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-voice
          path: bindings/react-native-voice/react-native-speechwarp-voice*.tgz

  publish-voice:
    # As `publish`. npm trusted publishing has to be set up for each of the three packages (this repository, this file,
    # the environment `npm`); until then the first release of each uses the environment secret NPM_TOKEN.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-voice
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v8
        with:
          name: npm-package-voice
      - name: Check the tag matches the version being published
        run: |
          ls *.tgz
          for name in react-native-speechwarp-voice react-native-speechwarp-voice-espeak react-native-speechwarp-voice-kokoro; do
            test -f "$name-${GITHUB_REF_NAME#v}.tgz" ||
              { echo "Tag $GITHUB_REF_NAME does not match the version of $name"; exit 1; }
          done
      # The engine packages name react-native-speechwarp-voice as a peer, so it goes first.
      - run: |
          version=${GITHUB_REF_NAME#v}
          npm publish "react-native-speechwarp-voice-$version.tgz" --access public
          npm publish "react-native-speechwarp-voice-espeak-$version.tgz" --access public
          npm publish "react-native-speechwarp-voice-kokoro-$version.tgz" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
