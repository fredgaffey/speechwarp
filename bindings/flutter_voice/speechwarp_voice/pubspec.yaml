name: speechwarp_voice
description: "Text read aloud on iOS and Android by the system's voices (and optionally Kokoro or eSpeak NG), sped up by speechwarp, with the character being spoken."
version: 0.3.7 # keep in step with SPEECHWARP_VERSION in include/speechwarp.h (tools/bump-version.sh sets it)
homepage: https://github.com/fredgaffey/speechwarp
repository: https://github.com/fredgaffey/speechwarp
topics: [text-to-speech, tts, audio, speech, accessibility]

environment:
  sdk: ^3.5.0
  # 3.44.2 fixed remote Swift package dependencies failing to download, which the iOS side has.
  flutter: '>=3.44.2'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.github.fredgaffey.speechwarp_voice
        pluginClass: SpeechwarpVoicePlugin
      ios:
        pluginClass: SpeechwarpVoicePlugin
