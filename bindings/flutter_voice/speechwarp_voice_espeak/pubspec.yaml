name: speechwarp_voice_espeak
description: "eSpeak NG voices for speechwarp_voice on Android and iOS, and the phonemizer Kokoro needs. Licensed under the GPL-3.0-or-later, unlike the rest of speechwarp."
version: 0.3.7 # keep in step with SPEECHWARP_VERSION in include/speechwarp.h (tools/bump-version.sh sets it)
homepage: https://github.com/fredgaffey/speechwarp
repository: https://github.com/fredgaffey/speechwarp
topics: [text-to-speech, tts, espeak, speech, phonemizer]

environment:
  sdk: ^3.5.0
  flutter: '>=3.44.2'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.github.fredgaffey.speechwarp_voice_espeak
        pluginClass: SpeechwarpVoiceEspeakPlugin
      ios:
        pluginClass: SpeechwarpVoiceEspeakPlugin
